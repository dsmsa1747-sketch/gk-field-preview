<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>지케이 기사앱 미리보기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eef1f5; --surface-3:#e4e9f0;
  --fg:#1a1d24; --muted:#5c6370; --line:#dde2e9;
  --primary:#2d4a7c; --primary-soft:#e7edf7; --on-primary:#ffffff;
  --flag:#9c5a0b; --flag-soft:#fbf1e3;
  --good:#2b6a4d; --good-soft:#e6f2ec;
  --bad:#a33131; --bad-soft:#fae9e9;
  --font-body:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171d; --surface:#1c2027; --surface-2:#232832; --surface-3:#2b3240;
  --fg:#e7e9ed; --muted:#98a0ac; --line:#2c323c;
  --primary:#88a9dd; --primary-soft:#1f2836; --on-primary:#10141a;
  --flag:#d99a52; --flag-soft:#2b2318;
  --good:#6cb995; --good-soft:#18271f;
  --bad:#e08a8a; --bad-soft:#2a1b1b;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14171d; --surface:#1c2027; --surface-2:#232832; --surface-3:#2b3240;
  --fg:#e7e9ed; --muted:#98a0ac; --line:#2c323c;
  --primary:#88a9dd; --primary-soft:#1f2836; --on-primary:#10141a;
  --flag:#d99a52; --flag-soft:#2b2318;
  --good:#6cb995; --good-soft:#18271f;
  --bad:#e08a8a; --bad-soft:#2a1b1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.6;font-size:15px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--fg);background:var(--surface)}

/* ---------- 상단 ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-weight:700;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);font-weight:400;letter-spacing:.04em}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;color:var(--muted);padding:6px 14px;border-radius:6px;font-weight:500;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.demo-note{background:var(--flag-soft);color:var(--flag);font-size:.78rem;padding:6px 16px;text-align:center;border-bottom:1px solid var(--line);font-weight:500}

.page{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
.hide{display:none !important}

/* ---------- WMS ---------- */
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px;scrollbar-width:thin}
.nav button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 13px;border-radius:20px;white-space:nowrap;font-size:.85rem}
.nav button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:500}
h2.sc{font-size:1.15rem;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
p.scd{color:var(--muted);font-size:.86rem;margin:0 0 16px;max-width:70ch}
h3{font-size:.95rem;margin:24px 0 8px;font-weight:700}
.req{display:inline-block;font-size:.7rem;font-family:var(--font-mono);background:var(--good-soft);color:var(--good);border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:middle;font-weight:500}
.req.f{background:var(--flag-soft);color:var(--flag)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 15px}
.card .k{font-size:.76rem;color:var(--muted);margin-bottom:3px}
.card .v{font-size:1.35rem;font-weight:700;font-family:var(--font-mono);letter-spacing:-.02em}
.card .s{font-size:.74rem;color:var(--muted);margin-top:2px}
.card.hi{border-color:var(--primary);background:var(--primary-soft)}
.card.warn{border-color:var(--flag);background:var(--flag-soft)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.panel>.ph{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:.88rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel>.pb{padding:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:520px}
th{background:var(--surface-2);text-align:left;font-weight:700;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.78rem;position:sticky;top:0}
td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--font-mono);white-space:nowrap}
.mono{font-family:var(--font-mono)}

.tag{display:inline-block;font-size:.72rem;padding:2px 7px;border-radius:11px;background:var(--surface-3);color:var(--muted);white-space:nowrap;font-weight:500}
.tag.b{background:var(--primary-soft);color:var(--primary)}
.tag.g{background:var(--good-soft);color:var(--good)}
.tag.f{background:var(--flag-soft);color:var(--flag)}
.tag.r{background:var(--bad-soft);color:var(--bad)}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 13px;border-radius:7px;font-size:.85rem;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.p{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.sm{padding:4px 9px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.srch{flex:1;min-width:150px;padding:7px 11px;border:1px solid var(--line);border-radius:7px}
label.chk{display:flex;gap:7px;align-items:center;font-size:.84rem;cursor:pointer}
.sw{display:flex;gap:8px;align-items:center;font-size:.84rem;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:none}
.sw b{font-weight:500}
.sw small{color:var(--muted);display:block;font-size:.76rem;font-weight:400}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--surface-3);border:none;position:relative;flex:0 0 auto;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle[aria-pressed="true"]{background:var(--primary)}
.toggle[aria-pressed="true"]::after{transform:translateX(18px)}

.note{color:var(--muted);font-size:.82rem;margin:8px 0 0;max-width:72ch}
.flag{background:var(--flag-soft);border-left:3px solid var(--flag);padding:11px 13px;border-radius:0 7px 7px 0;margin:0 0 14px;font-size:.85rem}
.flag strong{color:var(--flag)}
.good{background:var(--good-soft);border-left:3px solid var(--good);padding:11px 13px;border-radius:0 7px 7px 0;margin:0 0 14px;font-size:.85rem}
.good strong{color:var(--good)}

/* ---------- 모달 ---------- */
.mask{position:fixed;inset:0;background:rgba(10,12,16,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:11px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;border:1px solid var(--line)}
.modal .mh{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .mb{padding:16px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:none;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:0 4px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:.8rem;font-weight:500;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px}
.fld textarea{min-height:66px;resize:vertical}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-family:var(--font-mono);text-align:right}
.err{color:var(--bad);font-size:.78rem;margin-top:4px}

/* ---------- 기사앱 ---------- */
.appwrap{display:flex;gap:26px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.phone{width:360px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 6px 28px rgba(0,0,0,.14);display:flex;flex-direction:column;height:720px;max-height:82vh}
.pstat{background:var(--primary);color:var(--on-primary);padding:7px 14px;font-size:.72rem;font-family:var(--font-mono);display:flex;justify-content:space-between}
.phd{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;background:var(--surface-2);flex:0 0 auto}
.phd .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0}
.pbody{flex:1;overflow-y:auto;padding:13px 14px;-webkit-overflow-scrolling:touch}
.pfoot{border-top:1px solid var(--line);display:flex;flex:0 0 auto;background:var(--surface-2)}
.pfoot button{flex:1;border:none;background:transparent;color:var(--muted);padding:9px 2px;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.pfoot button[aria-pressed="true"]{color:var(--primary);font-weight:700;background:var(--surface)}
.pfoot .ic{font-size:1.05rem;line-height:1}

.jb{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:9px}
.jb .l1{display:flex;gap:7px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.jb .seq{width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:var(--font-mono)}
.jb .nm{font-weight:700;font-size:.9rem}
.jb .ad{font-size:.79rem;color:var(--muted);margin-bottom:6px;line-height:1.45}
.jb .acts{display:flex;gap:6px;flex-wrap:wrap}
.jb.done{opacity:.72}
.ord{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.ord button{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:26px;height:19px;font-size:.6rem;padding:0;color:var(--muted);display:flex;align-items:center;justify-content:center}
.appsec{font-size:.76rem;color:var(--muted);font-weight:700;margin:14px 0 7px;text-transform:none}
.appsec:first-child{margin-top:0}
.ql{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:.83rem;gap:10px}
.ql:last-child{border-bottom:none}
.ql span:first-child{color:var(--muted);flex:0 0 auto}
.ql span:last-child{text-align:right}
.q6{border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px}
.q6 .qt{font-size:.83rem;font-weight:500;margin-bottom:7px}
.q6 .qo{display:flex;gap:6px}
.q6 .qo button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 2px;font-size:.78rem;color:var(--muted)}
.q6 .qo button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:700}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:9px 0}
.thumb .pb2{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.25)}
.thumb .pb2>i{display:block;height:100%;background:var(--good);width:0;transition:width .12s linear}
.thumb{aspect-ratio:1;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.7rem}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:.7rem;line-height:1;padding:0}
.bar{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar>div{height:100%;background:var(--good);width:0;transition:width .2s}
canvas.sig{width:100%;height:150px;border:1px dashed var(--line);border-radius:8px;background:var(--surface);touch-action:none;display:block}
.pbtn{width:100%;padding:11px;border-radius:9px;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:700;margin-top:10px}
.pbtn.o{background:var(--surface);color:var(--primary)}
.pbtn:disabled{opacity:.45}
.side{width:320px;max-width:100%;font-size:.85rem}
.side h4{font-size:.9rem;margin:0 0 7px}
.side ul{padding-left:18px;margin:0 0 14px}
.side li{margin-bottom:5px;color:var(--muted)}
.side li b{color:var(--fg);font-weight:500}
.scanbox{border:2px dashed var(--primary);border-radius:9px;height:120px;display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:.82rem;margin:10px 0;background:var(--primary-soft)}
/* ---------- 의견 남기기 ---------- */
.fab{position:fixed;right:16px;bottom:16px;z-index:50;background:var(--flag);color:#fff;border:none;
  border-radius:22px;padding:11px 18px;font-weight:700;font-size:.88rem;box-shadow:0 3px 14px rgba(0,0,0,.25)}
.fab b{background:rgba(255,255,255,.25);border-radius:9px;padding:0 6px;margin-left:6px;font-size:.8rem}
.fbitem{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:.84rem;background:var(--surface-2)}
.fbitem .m{color:var(--muted);font-size:.74rem;margin-bottom:3px;display:flex;justify-content:space-between;gap:8px}
.fbout{width:100%;min-height:150px;font-family:var(--font-mono);font-size:.76rem;padding:9px;border:1px solid var(--line);border-radius:7px;white-space:pre}
@media (max-width:640px){
  .page{padding:14px 16px 76px}
  table{font-size:.8rem}
  .phone{height:calc(100vh - 230px);min-height:500px;border-radius:14px;box-shadow:none;width:100%}
  .appwrap{gap:16px}
  .side{width:100%}
  .fab{right:12px;bottom:12px;padding:10px 15px}
}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="brand">지케이 기사앱 <small>미리보기</small></div>
    <span class="tag b">현장 검토용</span>
  </div>
</div>
<div class="demo-note">새로 만들 앱을 미리 보시는 화면입니다 — 고객 정보는 전부 가짜라 아무거나 눌러 보셔도 됩니다 · 고쳤으면 하는 점은 오른쪽 아래 <b>의견 남기기</b>에</div>

<div class="page" id="viewApp">
  <div class="appwrap">
    <div class="phone">
      <div class="pstat"><span id="pNet">LTE</span><span>2026-10-15 14:05</span></div>
      <div class="phd" id="pHead"></div>
      <div class="pbody" id="pBody"></div>
      <div class="pfoot" id="pFoot"></div>
    </div>
    <div class="side" id="appSide"></div>
  </div>
</div>

<button class="fab" id="fab" onclick="openFb()">의견 남기기</button>
<div id="modalHost"></div>

<script>/* =========================================================
   지케이 전용 기사앱 — 현장 검토용
   금액·단가·정산은 이 판에 들어 있지 않습니다.
   ========================================================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- 데모 작업 데이터 (고객 정보 전부 가상) ---------- */
function mk(id,sh,cust,addr,rc,inch,code,ot,at,qty,tech,st,slot,memo,bc){

          bracketCancelled:bc===undefined?true:bc};
}
let JOBS = [
  mk('GK-24101','아이티스토리','김○○','서울 강서구 ○○로 12, 101동 ○○○호','수도권',65,'TVOUTLET-UA65','벽걸이','벽걸이',1,'기사 김○○','완료','오전',''),
  mk('GK-24102','아이티스토리','이○○','경기 고양시 ○○동 ○○아파트','수도권',43,'SAMSUNG-R43','직배송','직배송',1,'기사 김○○','완료','오전',''),
  mk('GK-24103','주원테크','박○○','부산 해운대구 ○○로 ○○','지방',75,'TVOUTLET-QN75','스탠드','스탠드',2,'기사 박○○','완료','오후',''),
  mk('GK-24104','주원테크','최○○','대구 수성구 ○○동 ○○','지방',50,'LG-R50','직배송','직배송',1,'기사 박○○','완료','오후',''),
  mk('GK-24105','레벨나인랩','정○○','서울 송파구 ○○로 ○○길 7','수도권',65,'LV9-W65','벽걸이','스탠드',1,'기사 이○○','완료','오전','현장 벽면 콘크리트 아님 — 스탠드로 변경',false),
  mk('GK-24106','아이티스토리','강○○','인천 남동구 ○○대로 ○○','수도권',86,'TVOUTLET-UA86','스탠드','스탠드',1,'기사 이○○','완료','오후',''),
  mk('GK-24107','아이티스토리','윤○○','전남 여수시 ○○로 ○○','지방',58,'SAMSUNG-R58','맞교환','맞교환',1,'기사 정○○','완료','오전',''),
  mk('GK-24108','아이티스토리','윤○○','전남 여수시 ○○로 ○○','지방',58,'R-SAMSUNG-R58','회수','회수',1,'기사 정○○','완료','오전','맞교환 회수품'),
  mk('GK-24109','주원테크','조○○','경기 성남시 ○○구 ○○로','수도권',65,'TVOUTLET-UA65','벽걸이','벽걸이',1,'기사 김○○','완료','오후','GK설치시파손 — 재설치분'),
  mk('GK-24110','알투텍','한○○','서울 노원구 ○○로 ○○','수도권',32,'RT-TVOUTLET-32','스탠드','스탠드',1,'기사 최○○','완료','오전',''),

function keepFocus(id){
  if(!id)return;
  const el=document.getElementById(id);
  if(!el)return;
  el.focus();
  try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}
}

function renderApp(focusId){

  const f={today:apToday,list:apList,scan:apScan,done:apDone,my:apMy,job:apJob,
           photo:apPhoto,check:apCheck,sign:apSign}[S.appScreen]||apToday;
  const r=f();
  head.innerHTML=r.head;body.innerHTML=r.body;
  document.getElementById('pFoot').innerHTML=APP_NAV.map(([k,l,i])=>
    `<button aria-pressed="${S.appScreen===k}" onclick="setApp('${k}')"><span class="ic">${i}</span>${l}</button>`).join('');

function mv(id,d){
  const l=myJobs().map(j=>j.id);const i=l.indexOf(id),k=i+d;

  [l[i],l[k]]=[l[k],l[i]];S.order=l;renderApp();
}

     :`<div class="note" style="margin:0">권고 10장 — 제품 정면 · 설치 상태 · 벽면/바닥 · 주변 정리 · 모델명 · 시리얼 · 리모컨 · 케이블 · 전체 · 고객 확인</div>`}

function addPhotos(e){
  const j=S.appJob, fs=Array.from(e.target.files).slice(0,PHOTO_N);
  if(!fs.length)return;
  S.photos[j]=fs.map(f=>URL.createObjectURL(f));
  // 4장 동시 병렬 전송을 시간으로 재현한다
  S.upload={prog:fs.map(()=>0),done:0,t:0};
  const n=fs.length, started=[];
  if(S._uptimer) clearInterval(S._uptimer);
  S._uptimer=setInterval(()=>{
    const u=S.upload; if(!u){clearInterval(S._uptimer);return;}
    u.t++;
    let active=u.prog.filter((p,i)=>p>0&&p<100).length;
    for(let i=0;i<n&&active<4;i++){ if(u.prog[i]===0){u.prog[i]=1;active++;} }
    for(let i=0;i<n;i++){ if(u.prog[i]>0&&u.prog[i]<100) u.prog[i]=Math.min(100,u.prog[i]+14+Math.random()*10); }
    u.done=u.prog.filter(p=>p>=100).length;
    if(u.done>=n){ S.lastSec=u.t/10; S.upload=null; clearInterval(S._uptimer); }
    if(S.view==='app'&&S.appScreen==='photo') renderApp();
  },100);
  renderApp();
}

let sigCtx=null,sigDrawn=false;
function initSig(){
  const c=document.getElementById('sigC');if(!c)return;
  const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr;c.height=r.height*dpr;
  sigCtx=c.getContext('2d');sigCtx.scale(dpr,dpr);
  sigCtx.strokeStyle=getComputedStyle(document.body).color;
  sigCtx.lineWidth=2;sigCtx.lineCap='round';sigCtx.lineJoin='round';
  sigDrawn=false;let on=false;
  const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
  c.addEventListener('pointerdown',e=>{on=true;sigDrawn=true;c.setPointerCapture(e.pointerId);
    const[x,y]=pt(e);sigCtx.beginPath();sigCtx.moveTo(x,y);});
  c.addEventListener('pointermove',e=>{if(!on)return;const[x,y]=pt(e);sigCtx.lineTo(x,y);sigCtx.stroke();});
  c.addEventListener('pointerup',()=>{on=false;});
}
function clearSig(){const c=document.getElementById('sigC');if(c&&sigCtx){sigCtx.clearRect(0,0,c.width,c.height);sigDrawn=false;}}
function saveSig(){
  if(!sigDrawn){alert('서명이 비어 있습니다.');return;}
  S.signed[S.appJob]=true;S.appScreen='job';renderApp();
}

/* =========================================================

const FB_KEY='gk_demo_fb_v1';
function fbLoad(){try{return JSON.parse(localStorage.getItem(FB_KEY)||'[]');}catch(e){return [];}}
function fbSave(a){try{localStorage.setItem(FB_KEY,JSON.stringify(a));}catch(e){}}
let FB=fbLoad();
function fbName(){try{return localStorage.getItem(FB_KEY+'_name')||'';}catch(e){return '';}}
function curScreen(){
  const m={today:'오늘 작업',list:'전체 목록',scan:'회수품 스캔',done:'완료 건',my:'내 정보',

function updFab(){const f=document.getElementById('fab');if(f)f.innerHTML='의견 남기기'+(FB.length?`<b>${FB.length}</b>`:'');}
function openFb(){
  document.getElementById('modalHost').innerHTML=`
  <div class="mask" onclick="if(event.target===this)closeModal()">
   <div class="modal">
    <div class="mh"><span>의견 남기기</span><button class="x" onclick="closeModal()">×</button></div>
    <div class="mb">

      <div class="fld"><label>성함</label><input id="fbNm" value="${esc(fbName())}" placeholder="예: 박미희 실장"></div>

      <div class="fld"><label>의견</label><textarea id="fbTx" placeholder="예: 설치현황에서 화주별로도 묶어 볼 수 있으면 좋겠습니다"></textarea>
        <div class="err hide" id="fbErr">내용을 적어 주십시오.</div></div>
      <button class="btn p" style="width:100%" onclick="fbAdd()">이 의견 담기</button>
      ${FB.length?`<h3 style="margin:18px 0 8px">담은 의견 ${FB.length}건</h3>
        ${FB.map((f,i)=>`<div class="fbitem"><div class="m"><span>${esc(f.sc)}</span>

function fbAdd(){
  const tx=document.getElementById('fbTx').value.trim();
  if(!tx){document.getElementById('fbErr').classList.remove('hide');return;}
  const nm=document.getElementById('fbNm').value.trim();
  try{localStorage.setItem(FB_KEY+'_name',nm);}catch(e){}
  FB.push({nm:nm,sc:document.getElementById('fbSc').value.trim(),tx:tx,
           at:new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})});
  fbSave(FB);updFab();openFb();
}
function fbDel(i){FB.splice(i,1);fbSave(FB);updFab();openFb();}
function fbClear(){if(confirm('담은 의견을 전부 지울까요?')){FB=[];fbSave(FB);updFab();openFb();}}
function fbText(){
  const nm=FB[0]&&FB[0].nm?FB[0].nm:'';
  return `[지케이 전용 시스템 데모 — 검토 의견]\n${nm?nm+'\n':''}${new Date().toLocaleDateString('ko-KR')}\n\n`
    + FB.map((f,i)=>`${i+1}. [${f.sc}]\n${f.tx}`).join('\n\n');
}
function fbCopy(){
  const t=fbText();
  const done=()=>{
    document.getElementById('modalHost').innerHTML=`
    <div class="mask" onclick="if(event.target===this)closeModal()"><div class="modal">
      <div class="mh"><span>복사되었습니다</span><button class="x" onclick="closeModal()">×</button></div>

        <textarea class="fbout" id="fbOut" readonly>${esc(t)}</textarea></div>
      <div class="mf"><button class="btn p" onclick="closeModal()">확인</button></div>
    </div></div>`;
    const o=document.getElementById('fbOut');if(o){o.focus();o.select();}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(done);
  } else {
    done();
    try{document.execCommand('copy');}catch(e){}
  }
}
